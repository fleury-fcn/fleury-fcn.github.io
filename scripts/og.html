<!DOCTYPE html>
<!-- Gabarit des images Open Graph (1200×630). Généré par scripts/og.mjs : /scripts/og.html?lang=fr|en -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  html,body{ width:1200px; height:630px; overflow:hidden; }
  body{ position:relative; padding:72px 80px; }
  body::before{ mask-image:none; }
  .og-glow{ position:absolute; right:-220px; top:-260px; width:760px; height:760px; border-radius:50%;
    background:radial-gradient(circle, rgba(198,243,90,.22), transparent 62%); }
  .og-lanes{ position:absolute; right:60px; top:150px; width:420px; height:300px; }
  .og-top{ display:flex; align-items:center; gap:14px; }
  .og-top .brand-mark{ width:46px; height:46px; font-size:15px; border-radius:12px; }
  .og-top span{ font-size:24px; font-weight:600; }
  h1{ margin-top:70px; font-family:var(--font-display); font-weight:400; font-size:104px; line-height:.95; letter-spacing:-.035em; }
  h1 em{ color:var(--accent); }
  .og-sub{ margin-top:36px; font-size:26px; color:var(--muted); }
  .og-sub strong{ color:var(--text); }
  .og-pill{ position:absolute; left:80px; bottom:64px; font-family:var(--font-mono); font-size:18px; color:var(--muted);
    border:1px solid var(--border-strong); border-radius:999px; padding:10px 18px; display:flex; gap:10px; align-items:center; }
  .og-pill i{ width:10px; height:10px; border-radius:50%; background:var(--accent); }
</style></head>
<body>
  <div class="og-glow"></div>
  <svg class="og-lanes" viewBox="0 0 420 300" aria-hidden="true"></svg>
  <div class="og-top"><span class="brand-mark">FN</span><span>Fleury Niyokwizera</span></div>
  <h1 id="t"></h1>
  <p class="og-sub" id="s"></p>
  <p class="og-pill"><i></i><span id="p"></span></p>
<script>
  const fr = { t:'Des millions de lignes.<br><em>Une</em> réponse fiable.', s:'<strong>Data Engineer</strong> · 4,5 M+ produits en production · agent IA (RAG + LLM)', p:'Alternance ou stage · dès novembre 2026' };
  const en = { t:'Millions of rows.<br><em>One</em> reliable answer.', s:'<strong>Data Engineer</strong> · 4.5M+ products in production · AI agent (RAG + LLM)', p:'Work-study or internship · from November 2026' };
  const d = new URLSearchParams(location.search).get('lang') === 'en' ? en : fr;
  t.innerHTML = d.t; s.innerHTML = d.s; p.textContent = d.p;
  // Voies de données : points désordonnés à gauche, alignés à droite
  const svg = document.querySelector('.og-lanes'); let out = '';
  for(let i=0;i<70;i++){
    const x = Math.random()*420, k = Math.min(1, Math.max(0, (x-120)/200));
    const lane = 40 + (i%9)*28, y = (Math.random()*300)*(1-k) + lane*k;
    out += `<circle cx="${x}" cy="${y}" r="${1.4+Math.random()*1.6}" fill="${k>.85||i%8===0?'#c6f35a':'#8c96b4'}" opacity="${.3+.6*k}"/>`;
    if(k>.6) out += `<line x1="${x-24*k}" y1="${y}" x2="${x}" y2="${y}" stroke="#c6f35a" stroke-opacity="${.35*k}"/>`;
  }
  svg.innerHTML = out;
</script>
</body></html>
